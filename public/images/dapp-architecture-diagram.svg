<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="50%" y="10%" font-size="30" text-anchor="middle">dApp architecture (Wallet → Frontend → Provider → Smart Contracts)</text>
  </g>
  <!-- simple boxes -->
  <g fill="#e6eef8" stroke="#2563eb">
    <rect x="120" y="220" width="200" height="100" rx="8"/>
    <rect x="420" y="220" width="200" height="100" rx="8"/>
    <rect x="720" y="220" width="200" height="100" rx="8"/>
    <rect x="420" y="360" width="200" height="100" rx="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a" font-size="18" text-anchor="middle">
    <text x="220" y="280">Wallet</text>
    <text x="520" y="280">Frontend</text>
    <text x="820" y="280">Provider / Node</text>
    <text x="520" y="420">Smart Contracts</text>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <path d="M320 270 L420 270" marker-end="url(#arrow)" />
    <path d="M620 270 L720 270" marker-end="url(#arrow)" />
    <path d="M520 320 L520 360" marker-end="url(#arrow)" />
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a" />
    </marker>
  </defs>
</svg>

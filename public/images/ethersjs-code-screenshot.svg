<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="80" y="80" width="1040" height="515" rx="8" fill="#0b1220" stroke="#1f2937"/>
  <text x="120" y="140" font-family="monospace" font-size="20" fill="#9ca3af">// Read an ERC-20 balance (ethers.js)</text>
  <text x="120" y="180" font-family="monospace" font-size="20" fill="#d1fae5">async function getBalance(providerUrl, tokenAddress, userAddress) {'{'}</text>
  <text x="140" y="210" font-family="monospace" font-size="18" fill="#d1fae5">const provider = new ethers.providers.JsonRpcProvider(providerUrl);</text>
  <text x="140" y="240" font-family="monospace" font-size="18" fill="#d1fae5">const abi = ['function balanceOf(address) view returns (uint256)'];</text>
  <text x="140" y="270" font-family="monospace" font-size="18" fill="#d1fae5">const token = new ethers.Contract(tokenAddress, abi, provider);</text>
  <text x="140" y="300" font-family="monospace" font-size="18" fill="#d1fae5">const balance = await token.balanceOf(userAddress);</text>
  <text x="140" y="330" font-family="monospace" font-size="18" fill="#d1fae5">return ethers.utils.formatUnits(balance, 18);</text>
  <text x="120" y="380" font-family="monospace" font-size="16" fill="#9ca3af">// (example display only)</text>
</svg>
